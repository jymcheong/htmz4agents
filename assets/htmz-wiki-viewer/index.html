<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alfred htmz Wiki Viewer 🌿</title>
  <style>
    :root {
      --bg-main: #0d1117;
      --bg-sidebar: #161b22;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #1f6feb;
      --bg-hover: #21262d;
      --bg-code: #161b22;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Hidden toggle checkbox for pure CSS sidebar toggle */
    #sidebar-toggle {
      display: none;
    }

    /* Universal Header Bar */
    .header-bar {
      display: flex;
      width: 100%;
      height: 50px;
      background-color: var(--bg-sidebar);
      border-bottom: 1px solid var(--border-color);
      align-items: center;
      padding: 0 15px;
      gap: 15px;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 999;
    }

    .menu-btn {
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Sidebar Drawer Styling (always a slide-in drawer on all screens) */
    #sidebar {
      width: 300px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Trigger sidebar sliding when checkbox is active */
    #sidebar-toggle:checked ~ #sidebar {
      transform: translateX(0);
    }

    /* Overlay Backdrop when sidebar open */
    #sidebar-backdrop {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(2px);
      z-index: 998;
    }

    #sidebar-toggle:checked ~ #sidebar-backdrop {
      display: block;
    }

    .sidebar-header {
      padding: 20px 20px 10px 20px;
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Search input */
    #search-input {
      width: calc(100% - 30px);
      margin: 10px 15px;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-main);
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }

    #search-input:focus {
      border-color: var(--accent);
    }

    .tree-container {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      border-top: 1px solid var(--border-color);
    }

    /* Tree Node Styling */
    .tree-container ul {
      list-style: none;
      padding-left: 15px;
    }

    .tree-container > ul {
      padding-left: 0;
    }

    .tree-node {
      margin: 4px 0;
    }

    .node-label {
      display: flex;
      align-items: center;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text-main);
      text-decoration: none;
      transition: background 0.2s;
    }

    .node-label:hover {
      background-color: var(--bg-hover);
    }

    .node-icon {
      margin-right: 8px;
      font-size: 1.1rem;
    }

    .dir-node > .node-label {
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Main Content Area */
    #content-area {
      flex: 1;
      overflow-y: auto;
      padding: 70px 20px 20px 20px; /* offset top for header */
      height: 100%;
    }

    #main-slot {
      max-width: 850px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* Markdown styling */
    .markdown-body h1, .markdown-body h2, .markdown-body h3 {
      margin-top: 24px;
      margin-bottom: 16px;
      font-weight: 600;
      line-height: 1.25;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.3em;
    }

    .markdown-body h1 { font-size: 2em; }
    .markdown-body h2 { font-size: 1.5em; }
    .markdown-body h3 { font-size: 1.25em; }

    .markdown-body p {
      margin-top: 0;
      margin-bottom: 16px;
    }

    .markdown-body ul {
      list-style: disc;
      padding-left: 2em;
      margin-bottom: 16px;
    }

    .markdown-body ol {
      list-style: decimal;
      padding-left: 2em;
      margin-bottom: 16px;
    }

    .markdown-body ul ul {
      list-style: circle;
      margin-bottom: 0;
    }

    .markdown-body li {
      margin-bottom: 4px;
    }

    .markdown-body a {
      color: var(--accent);
      text-decoration: none;
    }

    .markdown-body a:hover {
      text-decoration: underline;
    }

    .markdown-body pre {
      padding: 16px;
      overflow: auto;
      font-size: 85%;
      line-height: 1.45;
      background-color: var(--bg-code);
      border-radius: 6px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
    }

    .markdown-body code {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
      font-size: 85%;
    }

    .markdown-body blockquote {
      padding: 0 1em;
      color: var(--text-muted);
      border-left: 0.25em solid var(--border-color);
      margin-bottom: 16px;
    }

    .markdown-body ul, .markdown-body ol {
      margin-top: 0;
      margin-bottom: 16px;
      padding-left: 2em;
    }

    .markdown-body li {
      margin-top: 0.25em;
    }

    /* File Header info */
    .file-header {
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .file-path {
      font-family: monospace;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .error {
      color: #ff7b72;
      border: 1px solid #f85149;
      background-color: rgba(248, 81, 73, 0.1);
      padding: 20px;
      border-radius: 6px;
    }

    .wiki-link {
      font-weight: 500;
      border-bottom: 1px dashed var(--accent);
    }

    /* Vertical edge cue for easy sidebar toggling */
    .sidebar-edge-cue {
      position: fixed;
      left: 0;
      top: 50px;
      bottom: 0;
      width: 14px;
      z-index: 997;
      cursor: pointer;
      background-color: transparent;
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      transition: background-color 0.2s, border-right-color 0.2s;
    }

    .sidebar-edge-cue:hover {
      background-color: rgba(88, 166, 255, 0.08);
      border-right: 2px solid var(--accent);
    }

    /* Hide edge cue when sidebar is open */
    #sidebar-toggle:checked ~ .sidebar-edge-cue {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Hidden checkbox controller for mobile menu -->
  <input type="checkbox" id="sidebar-toggle">
  
  <!-- Backdrop for clicking outside sidebar -->
  <label for="sidebar-toggle" id="sidebar-backdrop"></label>

  <!-- Vertical edge cue to easily toggle sidebar -->
  <label for="sidebar-toggle" class="sidebar-edge-cue" title="Click left edge to toggle sidebar"></label>

  <!-- Universal header -->
  <div class="header-bar">
    <label for="sidebar-toggle" class="menu-btn">☰</label>
    <strong>Alfred Wiki 🌿</strong>
  </div>

  <!-- Sidebar Navigation -->
  <div id="sidebar">
    <div class="sidebar-header">
      <span>Alfred Wiki 🌿</span>
    </div>
    <!-- Search Bar -->
    <input type="text" id="search-input" placeholder="Search files..." oninput="filterTree()">
    
    <div class="tree-container" id="tree-container">
      <!-- File tree injected here -->
    </div>
  </div>

  <!-- Main Content Area -->
  <div id="content-area">
    <div id="main-slot">
      <div class="markdown-body">
        <h1>Welcome to Alfred Wiki Viewer</h1>
        <p>This is a custom, lightweight, <strong>htmz-based</strong> wiki viewer designed for the Alfred workspace.</p>
        <p>Select a markdown file from the sidebar to begin browsing. All relative wiki links will resolve automatically and load inside this area.</p>
      </div>
    </div>
  </div>

  <!-- htmz implementation -->
  <iframe name="htmz" hidden onload="window.htmz && window.htmz(this)"></iframe>

  <script>
    // 166-byte htmz snippet + hash/anchor scrolling logic
    window.htmz = function(frame) {
      setTimeout(() => {
        try {
          const doc = frame.contentDocument;
          const targetEl = document.getElementById('main-slot');
          const sourceEl = doc.getElementById('main-slot');
          if (targetEl && sourceEl) {
            targetEl.replaceWith(sourceEl);
            
            // Resolve anchor scrolling (either from iframe location hash or custom dataset)
            const iframeHash = frame.contentWindow.location.hash.split('#')[1];
            const anchor = frame.dataset.anchor || (iframeHash !== 'main-slot' ? iframeHash : '');
            if (anchor) {
              const anchorEl = document.getElementById(anchor) || document.getElementById(anchor.toLowerCase()) || document.getElementsByName(anchor)[0];
              if (anchorEl) {
                anchorEl.scrollIntoView({ behavior: 'smooth' });
              }
              frame.dataset.anchor = ''; // clear
            }
            
            // Close sidebar after clicking/loading a link
            const toggle = document.getElementById('sidebar-toggle');
            if (toggle) toggle.checked = false;
          }
        } catch (e) {
          console.error('htmz error:', e);
        }
      });
    };

    // Intercept all link clicks inside the content area to resolve relatively and route via htmz
    document.getElementById('content-area').addEventListener('click', (e) => {
      const link = e.target.closest('a');
      if (!link) return;
      
      const href = link.getAttribute('href');
      if (!href || href.startsWith('http') || href.startsWith('//') || href.startsWith('#')) return;
      
      if (href.startsWith('/view/')) {
        e.preventDefault();
        const iframe = document.querySelector('iframe[name="htmz"]');
        const url = new URL(href, window.location.origin);
        url.searchParams.set('htmz', 'true');
        iframe.contentWindow.location.replace(url.pathname + url.search + url.hash);
        return;
      }
      
      const fileHeader = document.querySelector('.file-path');
      if (!fileHeader) return;
      
      const parts = href.split('#');
      const pathOnly = parts[0];
      const anchor = parts[1] || '';
      
      const activePath = fileHeader.textContent;
      const slashIndex = activePath.lastIndexOf('/');
      const currentDir = slashIndex !== -1 ? activePath.substring(0, slashIndex) : '';
      
      const resolvedPath = resolveRelativePath(currentDir, pathOnly);
      
      e.preventDefault();
      const iframe = document.querySelector('iframe[name="htmz"]');
      iframe.dataset.anchor = anchor;
      iframe.contentWindow.location.replace(`/view/${resolvedPath}?htmz=true#main-slot`);
    });

    function resolveRelativePath(base, relative) {
      const stack = base ? base.split('/') : [];
      const parts = relative.split('/');
      for (let i = 0; i < parts.length; i++) {
        if (parts[i] === '' || parts[i] === '.') continue;
        if (parts[i] === '..') {
          stack.pop();
        } else {
          stack.push(parts[i]);
        }
      }
      return stack.join('/');
    }

    // Build sidebar file tree (Collapsed by default)
    function renderTree(nodes, container) {
      const ul = document.createElement('ul');
      nodes.forEach(node => {
        const li = document.createElement('li');
        li.className = 'tree-node ' + (node.type === 'directory' ? 'dir-node' : 'file-node');
        
        const label = document.createElement(node.type === 'file' ? 'a' : 'div');
        label.className = 'node-label';
        
        if (node.type === 'file') {
          label.href = `/view/${node.path}?htmz=true#main-slot`;
          label.setAttribute('target', 'htmz');
        }
        
        const icon = document.createElement('span');
        icon.className = 'node-icon';
        icon.textContent = node.type === 'directory' ? '📁' : '📄';
        
        const text = document.createTextNode(node.name);
        
        label.appendChild(icon);
        label.appendChild(text);
        li.appendChild(label);
        
        if (node.type === 'directory') {
          const childContainer = document.createElement('div');
          childContainer.style.display = 'none';
          li.appendChild(childContainer);
          renderTree(node.children, childContainer);
          
          label.addEventListener('click', (e) => {
            childContainer.style.display = childContainer.style.display === 'none' ? 'block' : 'none';
            icon.textContent = childContainer.style.display === 'none' ? '📁' : '📂';
          });
        }
        
        ul.appendChild(li);
      });
      container.appendChild(ul);
    }

    // Sidebar search filter tree
    function filterTree() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const nodes = document.querySelectorAll('.tree-node');
      
      nodes.forEach(node => {
        const text = node.querySelector('.node-label').textContent.toLowerCase();
        const isDir = node.classList.contains('dir-node');
        
        if (query === '') {
          node.style.display = '';
          if (isDir) {
            const childContainer = node.querySelector('div');
            if (childContainer) {
              childContainer.style.display = 'none';
            }
            const icon = node.querySelector('.node-icon');
            if (icon) icon.textContent = '📁';
          }
          return;
        }
        
        if (!isDir && text.includes(query)) {
          node.style.display = '';
          let parent = node.parentElement.closest('.dir-node');
          while (parent) {
            parent.style.display = '';
            const childContainer = parent.querySelector('div');
            if (childContainer) childContainer.style.display = 'block';
            const icon = parent.querySelector('.node-icon');
            if (icon) icon.textContent = '📂';
            parent = parent.parentElement.closest('.dir-node');
          }
        } else if (isDir) {
          node.style.display = 'none';
        } else {
          node.style.display = 'none';
        }
      });
    }

    // Load file tree on startup and handle deep linking + initial show-and-hide
    fetch('/api/tree')
      .then(res => res.json())
      .then(tree => {
        const container = document.getElementById('tree-container');
        renderTree(tree, container);
        
        // Deep linking on load (e.g. ?page=knowledge/telegram-dispatch.md)
        const urlParams = new URLSearchParams(window.location.search);
        const pageParam = urlParams.get('page');
        if (pageParam) {
          const iframe = document.querySelector('iframe[name="htmz"]');
          iframe.contentWindow.location.replace(`/view/${pageParam}?htmz=true#main-slot`);
        }
      })
      .catch(err => {
        console.error('Failed to load file tree:', err);
      });
  </script>
</body>
</html>
