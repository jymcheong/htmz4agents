<!-- Template reference — server populates {{filename}}, {{ext}}, {{size}} at runtime -->
<div class="result-fragment result-success" data-outcome="success">
  <div class="result-icon success-icon">&#10003;</div>
  <div class="result-body">
    <div class="result-title">Upload complete</div>
    <div class="result-filename">{{filename}}</div>
    <div class="result-meta">
      <span class="badge">{{ext}}</span>
      <span>{{size}}</span>
    </div>
  </div>
</div>
