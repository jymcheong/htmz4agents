<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme Switch · Basecoat + Alpine</title>

  <!-- Anti-FOUC: apply saved theme before CSS loads, before first paint -->
  <script>
    (function () {
      var saved = localStorage.getItem('bc-theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
    }());
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Basecoat CSS (bundles Tailwind v4 — class-based dark mode via .dark on <html>) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@latest/dist/basecoat.cdn.min.css">

  <!-- Alpine before Basecoat JS so MutationObserver finds x-data already bound -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/basecoat-css@latest/dist/js/all.min.js"></script>

  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
    }

    /* ── Layout ────────────────────────────────────────────────────────── */
    .page-wrap {
      max-width: 28rem;
      margin: 0 auto;
      padding: 3rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .page-header-text h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0;
    }

    .page-header-text p {
      font-size: 0.875rem;
      opacity: 0.6;
      margin: 0.125rem 0 0;
    }

    /* ── Form fields inside cards ──────────────────────────────────────── */
    .field {
      display: grid;
      gap: 0.375rem;
    }

    .card section { display: flex; flex-direction: column; gap: 1rem; }

    /* ── Notification rows ─────────────────────────────────────────────── */
    .notif-row {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      cursor: pointer;
    }

    .notif-row input[type="checkbox"] { margin-top: 0.125rem; flex-shrink: 0; }

    .notif-row p.notif-title { font-size: 0.875rem; font-weight: 500; margin: 0; }
    .notif-row p.notif-desc  { font-size: 0.75rem; opacity: 0.6; margin: 0.125rem 0 0; }

    /* ── Card footer layout ─────────────────────────────────────────────── */
    .card footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-actions { display: flex; gap: 0.5rem; }

    /* ── Footer note ───────────────────────────────────────────────────── */
    .page-footer {
      font-size: 0.75rem;
      opacity: 0.5;
      text-align: center;
    }

    .page-footer code { font-family: monospace; }
  </style>
</head>

<body class="bg-background text-foreground"
  x-data="{
    isDark: document.documentElement.classList.contains('dark'),
    toggle() {
      this.isDark = !this.isDark;
      document.documentElement.classList.toggle('dark', this.isDark);
      localStorage.setItem('bc-theme', this.isDark ? 'dark' : 'light');
    }
  }">

  <div class="page-wrap">

    <!-- Page header -->
    <div class="page-header">
      <div class="page-header-text">
        <h1>Settings</h1>
        <p>Manage your preferences</p>
      </div>
      <button class="btn-outline" @click="toggle()" style="display:flex;align-items:center;gap:0.5rem;">
        <span x-text="isDark ? '☀' : '🌙'"></span>
        <span x-text="isDark ? 'Light' : 'Dark'"></span>
      </button>
    </div>

    <!-- Profile card — exercises: input, textarea, label, badge, buttons -->
    <div class="card">
      <header>
        <h2>Profile</h2>
        <p>Update your public information</p>
      </header>
      <section>
        <div class="field">
          <label class="label" for="name">Display name</label>
          <input id="name" class="input" type="text" placeholder="Your name">
        </div>
        <div class="field">
          <label class="label" for="email">Email</label>
          <input id="email" class="input" type="email" placeholder="you@example.com">
        </div>
        <div class="field">
          <label class="label" for="bio">Bio</label>
          <textarea id="bio" class="textarea" rows="3" placeholder="Tell us about yourself"></textarea>
        </div>
      </section>
      <footer>
        <span class="badge-outline" x-text="isDark ? '🌙 dark' : '☀ light'"></span>
        <div class="footer-actions">
          <button class="btn-outline">Cancel</button>
          <button class="btn">Save</button>
        </div>
      </footer>
    </div>

    <!-- Notifications card — exercises: checkbox -->
    <div class="card">
      <header>
        <h2>Notifications</h2>
        <p>Choose what you want to be notified about</p>
      </header>
      <section>
        <label class="notif-row">
          <input type="checkbox" class="input" checked>
          <div>
            <p class="notif-title">Push alerts</p>
            <p class="notif-desc">Get notified in-browser</p>
          </div>
        </label>
        <label class="notif-row">
          <input type="checkbox" class="input">
          <div>
            <p class="notif-title">Weekly digest</p>
            <p class="notif-desc">Summary every Monday</p>
          </div>
        </label>
        <label class="notif-row">
          <input type="checkbox" class="input" checked>
          <div>
            <p class="notif-title">Security alerts</p>
            <p class="notif-desc">Login and access events</p>
          </div>
        </label>
      </section>
    </div>

    <!-- Proof of persistence -->
    <p class="page-footer">
      Preference persisted to <code>localStorage["bc-theme"]</code>
      · reload to confirm
    </p>

  </div>
</body>
</html>
