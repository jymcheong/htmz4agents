<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Static Demo · Basecoat + htmz</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Basecoat CSS (bundles Tailwind v4.1.4) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@latest/dist/basecoat.cdn.min.css">
  <!-- Basecoat JS -->
  <script src="https://cdn.jsdelivr.net/npm/basecoat-css@latest/dist/js/all.min.js" defer></script>

  <style>
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --app-border: #21262d;
      --app-border-light: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --text-faint: #484f58;
      --blue: #58a6ff;
      --green: #3fb950;
      --red: #f85149;
      --red-soft: #ff7b72;
      --orange: #e3b341;
    }
    .btn-outline {
      border-color: #30363d !important;
      color: #8b949e !important;
    }
    .btn-outline:hover {
      background: rgba(255,255,255,0.06) !important;
      border-color: #8b949e !important;
      color: #e6edf3 !important;
    }
    .btn {
      background: #238636 !important;
      border-color: rgba(63,185,80,0.3) !important;
      color: #fff !important;
    }
    .btn:hover { background: #2ea043 !important; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* Sidebar */
    #main-sidebar { background: var(--bg); border-color: #21262d; }
    #main-sidebar .logo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--blue);
    }
    #main-sidebar button.nav-link {
      appearance: none;
      background: transparent;
      border: none;
      cursor: pointer;
      width: 100%;
      text-align: left;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
      transition: color 0.15s, background 0.15s;
    }
    #main-sidebar button.nav-link:hover:not([aria-current="page"]) {
      background: rgba(255,255,255,0.05);
      color: var(--text);
    }
    #main-sidebar button[aria-current="page"] {
      background: rgba(88,166,255,0.1);
      color: var(--blue);
      font-weight: 600;
    }

    /* Fragment entrance */
    #content-area > * { animation: frag-in 0.25s ease; }
    @keyframes frag-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Card severity glow */
    .glow-critical {
      box-shadow: 0 0 0 1px rgba(248,81,73,0.12),
                  0 -2px 16px 0 rgba(248,81,73,0.18),
                  0 4px 24px 0 rgba(0,0,0,0.6);
    }
    .glow-high {
      box-shadow: 0 0 0 1px rgba(227,179,65,0.12),
                  0 -2px 16px 0 rgba(227,179,65,0.18),
                  0 4px 24px 0 rgba(0,0,0,0.6);
    }

    /* Accordion */
    details.group summary:hover { color: var(--text); background: rgba(255,255,255,0.03); }
    .accordion-body {
      background: inherit;
      padding-top: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }
    .accordion-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }
    .cve-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--red-soft);
      white-space: nowrap;
      min-width: 140px;
    }
    .cve-severity { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; font-weight: 700; white-space: nowrap; }
    .cve-severity-crit { color: var(--red); }
    .cve-severity-high { color: var(--red-soft); }
    .cve-severity-med  { color: var(--orange); }

    /* Stat pill */
    .stat-pill { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; border-radius: 6px; padding: 6px 12px; }
    .stat-pill-crit { background: #21060a; border: 1px solid rgba(248,81,73,0.2); }
    .stat-pill-high { background: #1a1400; border: 1px solid rgba(227,179,65,0.2); }
    .stat-label { font-family: 'JetBrains Mono', monospace; font-size: 0.6875rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
    .stat-divider { width: 1px; height: 14px; flex-shrink: 0; }
    .stat-pill-crit .stat-divider { background: rgba(248,81,73,0.25); }
    .stat-pill-high .stat-divider { background: rgba(227,179,65,0.25); }
    .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 0.8125rem; font-weight: 700; }
    .stat-value-crit { color: var(--red-soft); }
    .stat-value-high { color: var(--orange); }
    .stat-value-ok   { color: var(--green); }

    /* Dialog */
    dialog.dialog::backdrop { background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
    dialog.dialog {
      background: var(--bg-card);
      border: 1px solid var(--app-border-light);
      border-radius: 12px;
      color: var(--text);
      box-shadow: 0 8px 40px rgba(0,0,0,0.7);
    }
    dialog.dialog > div > header h2 { font-size: 0.875rem; font-weight: 700; color: var(--text); }
    dialog.dialog > div > header p  { color: var(--text-muted); font-size: 0.8125rem; }
    dialog.dialog > div > section   { color: var(--text); }
    dialog details.group summary { font-size: 0.875rem; color: var(--text-muted); transition: color 0.15s; }
    dialog details.group summary:hover { color: var(--text); background: transparent; }
    dialog details.group[open] > summary { color: var(--text); }
    .cve-row { border-bottom: 1px solid var(--app-border); }
    .cve-row:last-child { border-bottom: none; }

    /* Verdict block */
    .verdict-block {
      background: var(--bg);
      border-radius: 0 6px 6px 0;
      padding: 14px 16px;
      margin-top: 16px;
    }
    .glow-critical .verdict-block { border-left: 4px solid var(--red); }
    .glow-high     .verdict-block { border-left: 4px solid var(--orange); }
    .verdict-block p { color: #c9d1d9; font-size: 0.875rem; line-height: 1.7; }

    /* Context grid */
    .ctx-grid { display: grid; grid-template-columns: 140px 1fr; gap: 7px 16px; font-size: 0.875rem; }
    .ctx-label { color: var(--text-muted); font-weight: 500; }
    .ctx-value { color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 0.8125rem; }

    .font-mono { font-family: 'JetBrains Mono', monospace; }

    /* Fragment loading overlay */
    .fragment-loading { position: relative; pointer-events: none; opacity: 0.45; transition: opacity 0.2s; }
    .fragment-loading::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 25%, rgba(255,255,255,0.04) 50%, transparent 75%);
      background-size: 400% 100%;
      animation: frag-shimmer 1.4s ease infinite;
    }
    @keyframes frag-shimmer {
      0%   { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }
  </style>
</head>
<body class="bg-[#0d1117] text-[#e6edf3] min-h-screen flex">

  <!-- ═══════════════ SIDEBAR ═══════════════ -->
  <aside id="main-sidebar" class="w-56 shrink-0 border-r flex flex-col">
    <div class="px-4 pt-5 pb-4 border-b border-[#21262d]">
      <div class="logo">htmz</div>
      <div style="display:flex;align-items:center;gap:6px;margin-top:6px">
        <span style="width:5px;height:5px;border-radius:50%;background:#3fb950;flex-shrink:0;box-shadow:0 0 5px rgba(63,185,80,0.6)"></span>
        <span class="text-[11px] text-[#484f58] font-mono">static · no server</span>
      </div>
    </div>
    <nav class="px-2 py-3 flex-1">
      <p class="text-[10px] font-semibold tracking-[0.1em] uppercase text-[#484f58] px-2 mb-2">Views</p>
      <ul class="flex flex-col gap-0.5">
        <li><button class="nav-link" id="nav-dashboard" aria-current="page" onclick="navigateTo('dashboard')">Dashboard</button></li>
        <li><button class="nav-link" id="nav-hosts"     onclick="navigateTo('hosts')">Host Inventory</button></li>
      </ul>
    </nav>
  </aside>

  <!-- ═══════════════ MAIN ═══════════════ -->
  <main class="flex-1 flex flex-col min-w-0">

    <div id="content-area" class="px-16 py-7" style="max-width:900px;margin:0 auto;width:100%">
      <div class="flex flex-col items-center justify-center py-24 gap-4">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="status" aria-label="Loading" class="size-6 animate-spin text-[#484f58]"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        <p class="text-sm text-[#484f58]">Loading…</p>
      </div>
    </div>

    <!--
      htmz — the entire "framework":
      iframe loads a fragment HTML file, then onload extracts the element
      matching the URL hash and replaces the target slot with its children.
    -->
    <iframe hidden name="htmz"
      onload="setTimeout(()=>{
        const hash = contentWindow.location.hash;
        if (!hash) return;
        const slot = document.querySelector(hash);
        if (!slot) return;
        slot.removeAttribute('data-loading');
        slot.classList.remove('fragment-loading');
        slot.replaceWith(...contentWindow.document.body.childNodes);
        if(window.basecoat) window.basecoat.initAll();
        initAccordions();
      },0)">
    </iframe>
  </main>

  <div id="toaster" class="toaster"></div>

  <script>
    /* ── Relative paths — works on file://, localhost, and GitHub Pages ── */
    const NAV_MAP = {
      dashboard: 'fragments/dashboard.html',
      hosts:     'fragments/hosts.html',
    };

    function navigateTo(v) {
      document.querySelectorAll('#main-sidebar button[aria-current]').forEach(b => b.removeAttribute('aria-current'));
      const b = document.getElementById('nav-' + v);
      if (b) b.setAttribute('aria-current', 'page');
      loadFragment(NAV_MAP[v], 'content-area');
    }

    function loadFragment(src, tid) {
      const slot = document.getElementById(tid);
      if (slot) {
        slot.setAttribute('data-loading', '');
        slot.classList.add('fragment-loading');
      }
      /* cache-bust with ?t= so same-URL re-navigation always fires onload */
      const iframe = document.querySelector('iframe[name="htmz"]');
      if (iframe) iframe.src = src + '?t=' + Date.now() + '#' + tid;
    }

    /* ── Pre-canned host detail (replaces fetch('/api/host-detail')) ── */
    const HOST_DETAIL = {
      'ENDPOINT-001': `
        <dialog id="host-detail-dialog" class="dialog" style="max-width:640px;width:100%;padding:0">
          <div>
            <header style="padding:1.5rem 1.5rem 1rem;border-bottom:1px solid #21262d">
              <div style="display:flex;justify-content:space-between;align-items:flex-start">
                <div>
                  <h2 class="font-mono" style="font-size:1rem;font-weight:700;color:#e6edf3">ENDPOINT-001</h2>
                  <p style="margin-top:4px">Internet-facing &middot; Windows Server 2019 &middot; Finance zone</p>
                </div>
                <button onclick="document.getElementById('host-detail-dialog').close()" style="background:none;border:none;cursor:pointer;color:#8b949e;font-size:1.25rem;line-height:1">&times;</button>
              </div>
            </header>
            <section style="padding:1.25rem 1.5rem">
              <div class="ctx-grid">
                <span class="ctx-label">Status</span>   <span class="ctx-value" style="color:#f85149">&#9679; Unpatched</span>
                <span class="ctx-label">Last scan</span> <span class="ctx-value">2025-03-18 02:14 UTC</span>
                <span class="ctx-label">Agent</span>     <span class="ctx-value">v3.2.1 (healthy)</span>
                <span class="ctx-label">IP</span>        <span class="ctx-value">203.0.113.42</span>
                <span class="ctx-label">Owner</span>     <span class="ctx-value">finance-ops@company.com</span>
              </div>
              <div class="accordion border-t border-[#30363d] mt-5 py-2">
                <details class="group">
                  <summary style="display:flex;justify-content:space-between;align-items:center;padding:.75rem 0;font-size:.875rem;font-weight:500;color:#8b949e;cursor:pointer;">
                    <span>CVE breakdown</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="transition-transform duration-200 group-open:rotate-180"><path d="m6 9 6 6 6-6"/></svg>
                  </summary>
                  <div style="padding-bottom:.75rem;display:flex;flex-direction:column;gap:.5rem">
                    <div class="cve-row flex items-start gap-3 py-2">
                      <span class="cve-id">CVE-2025-0381</span>
                      <span class="flex-1" style="font-size:.8125rem;color:#c9d1d9">RDP pre-auth RCE · KEV-listed · EPSS 0.94</span>
                      <span class="cve-severity cve-severity-crit">9.8</span>
                    </div>
                    <div class="cve-row flex items-start gap-3 py-2">
                      <span class="cve-id">CVE-2024-4892</span>
                      <span class="flex-1" style="font-size:.8125rem;color:#c9d1d9">NTLM hash relay via SMB · public PoC</span>
                      <span class="cve-severity cve-severity-high">7.5</span>
                    </div>
                  </div>
                </details>
              </div>
            </section>
            <footer style="padding:.75rem 1.5rem 1.25rem;display:flex;gap:.5rem">
              <button class="btn-outline btn-sm" onclick="document.getElementById('host-detail-dialog').close()">Close</button>
            </footer>
          </div>
        </dialog>`,

      'ENDPOINT-002': `
        <dialog id="host-detail-dialog" class="dialog" style="max-width:640px;width:100%;padding:0">
          <div>
            <header style="padding:1.5rem 1.5rem 1rem;border-bottom:1px solid #21262d">
              <div style="display:flex;justify-content:space-between;align-items:flex-start">
                <div>
                  <h2 class="font-mono" style="font-size:1rem;font-weight:700;color:#e6edf3">ENDPOINT-002</h2>
                  <p style="margin-top:4px">Internal &middot; Ubuntu 20.04 &middot; DevOps zone</p>
                </div>
                <button onclick="document.getElementById('host-detail-dialog').close()" style="background:none;border:none;cursor:pointer;color:#8b949e;font-size:1.25rem;line-height:1">&times;</button>
              </div>
            </header>
            <section style="padding:1.25rem 1.5rem">
              <div class="ctx-grid">
                <span class="ctx-label">Status</span>   <span class="ctx-value" style="color:#f85149">&#9679; Unpatched</span>
                <span class="ctx-label">Last scan</span> <span class="ctx-value">2025-03-18 03:41 UTC</span>
                <span class="ctx-label">Agent</span>     <span class="ctx-value">v3.2.1 (healthy)</span>
                <span class="ctx-label">IP</span>        <span class="ctx-value">10.10.42.17</span>
                <span class="ctx-label">Owner</span>     <span class="ctx-value">devops-lead@company.com</span>
              </div>
              <div class="accordion border-t border-[#30363d] mt-5 py-2">
                <details class="group">
                  <summary style="display:flex;justify-content:space-between;align-items:center;padding:.75rem 0;font-size:.875rem;font-weight:500;color:#8b949e;cursor:pointer;">
                    <span>CVE breakdown</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="transition-transform duration-200 group-open:rotate-180"><path d="m6 9 6 6 6-6"/></svg>
                  </summary>
                  <div style="padding-bottom:.75rem;display:flex;flex-direction:column;gap:.5rem">
                    <div class="cve-row flex items-start gap-3 py-2">
                      <span class="cve-id">CVE-2025-1102</span>
                      <span class="flex-1" style="font-size:.8125rem;color:#c9d1d9">sudo heap overflow · KEV-listed · local privesc</span>
                      <span class="cve-severity cve-severity-crit">9.1</span>
                    </div>
                    <div class="cve-row flex items-start gap-3 py-2">
                      <span class="cve-id">CVE-2024-6741</span>
                      <span class="flex-1" style="font-size:.8125rem;color:#c9d1d9">OpenSSH pre-auth memory corruption · public PoC</span>
                      <span class="cve-severity cve-severity-high">7.8</span>
                    </div>
                  </div>
                </details>
              </div>
            </section>
            <footer style="padding:.75rem 1.5rem 1.25rem;display:flex;gap:.5rem">
              <button class="btn-outline btn-sm" onclick="document.getElementById('host-detail-dialog').close()">Close</button>
            </footer>
          </div>
        </dialog>`,

      'ENDPOINT-003': `
        <dialog id="host-detail-dialog" class="dialog" style="max-width:640px;width:100%;padding:0">
          <div>
            <header style="padding:1.5rem 1.5rem 1rem;border-bottom:1px solid #21262d">
              <div style="display:flex;justify-content:space-between;align-items:flex-start">
                <div>
                  <h2 class="font-mono" style="font-size:1rem;font-weight:700;color:#e6edf3">ENDPOINT-003</h2>
                  <p style="margin-top:4px">Internal &middot; Windows Server 2012 R2 &middot; HR zone &middot; EOL</p>
                </div>
                <button onclick="document.getElementById('host-detail-dialog').close()" style="background:none;border:none;cursor:pointer;color:#8b949e;font-size:1.25rem;line-height:1">&times;</button>
              </div>
            </header>
            <section style="padding:1.25rem 1.5rem">
              <div class="ctx-grid">
                <span class="ctx-label">Status</span>   <span class="ctx-value" style="color:#e3b341">&#9679; No vendor patch</span>
                <span class="ctx-label">Last scan</span> <span class="ctx-value">2025-03-17 22:05 UTC</span>
                <span class="ctx-label">Agent</span>     <span class="ctx-value">v3.1.8 (healthy)</span>
                <span class="ctx-label">IP</span>        <span class="ctx-value">10.10.11.204</span>
                <span class="ctx-label">Owner</span>     <span class="ctx-value">hr-it@company.com</span>
              </div>
            </section>
            <footer style="padding:.75rem 1.5rem 1.25rem;display:flex;gap:.5rem">
              <button class="btn-outline btn-sm" onclick="document.getElementById('host-detail-dialog').close()">Close</button>
            </footer>
          </div>
        </dialog>`,
    };

    function openHostDetail(host) {
      const html = HOST_DETAIL[host];
      if (!html) return;
      const old = document.getElementById('host-detail-dialog');
      if (old) old.remove();
      document.body.insertAdjacentHTML('beforeend', html);
      if (window.basecoat) window.basecoat.initAll();
      initAccordions();
      document.getElementById('host-detail-dialog').showModal();
    }

    function toast(category, title, desc) {
      document.dispatchEvent(new CustomEvent('basecoat:toast', {
        detail: { config: { category, title, description: desc, cancel: { label: 'Dismiss' } } }
      }));
    }

    function initAccordions() {
      document.querySelectorAll('.accordion').forEach(accordion => {
        if (accordion.dataset.bound === '1') return;
        accordion.dataset.bound = '1';
        accordion.addEventListener('click', e => {
          const s = e.target.closest('summary');
          if (!s) return;
          const d = s.closest('details');
          if (!d) return;
          accordion.querySelectorAll('details').forEach(e2 => { if (e2 !== d) e2.removeAttribute('open'); });
        });
      });
    }

    addEventListener('DOMContentLoaded', () => setTimeout(() => navigateTo('dashboard'), 150));
  </script>
</body>
</html>
