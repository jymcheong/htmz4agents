<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm Dialog · htmz P18</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Basecoat CSS (bundles Tailwind v4) + JS (vanilla, framework-agnostic) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@latest/dist/basecoat.cdn.min.css">
  <script src="https://cdn.jsdelivr.net/npm/basecoat-css@latest/dist/js/all.min.js" defer></script>
  <!-- Alpine.js — separate from Basecoat; must load before any x-data is initialised -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    /* ── Theme ──────────────────────────────────────────────────── */
    :root {
      --bg:          #0d1117;
      --bg-card:     #161b22;
      --border:      #21262d;
      --border-lite: #30363d;
      --text:        #e6edf3;
      --muted:       #8b949e;
      --red:         #da3633;
      --red-hover:   #b91c1c;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      margin: 0;
    }

    /* ── Card ───────────────────────────────────────────────────── */
    .demo-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      width: 100%;
      max-width: 28rem;
      overflow: hidden;
    }
    .demo-card-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .demo-card-title {
      font-size: 0.9375rem;
      font-weight: 600;
      margin: 0 0 0.375rem;
    }
    .demo-card-desc {
      font-size: 0.8125rem;
      color: var(--muted);
      margin: 0;
      line-height: 1.5;
    }

    /* ── Item list ──────────────────────────────────────────────── */
    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .item-row:last-child { border-bottom: none; }

    .item-name {
      font-size: 0.875rem;
      font-weight: 500;
    }
    .empty-msg {
      padding: 2rem 1.5rem;
      text-align: center;
      font-size: 0.875rem;
      color: var(--muted);
    }

    /* ── Override Basecoat btn-outline for dark theme ───────────── */
    .btn-outline {
      border-color: var(--border-lite) !important;
      color: var(--muted) !important;
    }
    .btn-outline:hover {
      background: rgba(255,255,255,0.06) !important;
      border-color: var(--muted) !important;
      color: var(--text) !important;
    }

    /* ── Override Basecoat btn-destructive ──────────────────────── */
    .btn-destructive {
      background: var(--red) !important;
      border-color: transparent !important;
      color: #fff !important;
    }
    .btn-destructive:hover {
      background: var(--red-hover) !important;
    }

    /* ── Native <dialog> ────────────────────────────────────────── */
    dialog {
      margin: auto !important;
      border: 1px solid var(--border-lite);
      border-radius: 10px;
      background: var(--bg-card);
      color: var(--text);
      padding: 0;
      width: 100%;
      max-width: 28rem;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
    }
    dialog::backdrop {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(3px);
    }
    dialog[open] {
      animation: dialog-in 150ms ease-out;
    }
    @keyframes dialog-in {
      from { opacity: 0; transform: scale(0.97) translateY(-6px); }
      to   { opacity: 1; transform: scale(1)    translateY(0); }
    }

    .dialog-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .dialog-title {
      font-size: 0.9375rem;
      font-weight: 600;
      margin: 0 0 0.25rem;
    }
    .dialog-subtitle {
      font-size: 0.8125rem;
      color: var(--muted);
      margin: 0;
    }
    .dialog-body {
      padding: 1.25rem 1.5rem;
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .dialog-body strong { color: var(--text); font-weight: 500; }
    .dialog-footer {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <!-- ─── Page card ─── -->
  <div class="demo-card">
    <div class="demo-card-header">
      <h1 class="demo-card-title">Project Items</h1>
      <p class="demo-card-desc">
        Click <strong>Delete</strong> on any item. A confirmation dialog
        appears before the action fires (P18). No server — items are
        removed from the DOM directly.
      </p>
    </div>

    <!--
      #item-list — would be a htmz swap target in a server-backed app.
      The <dialog> lives OUTSIDE this div so htmz could replace the entire
      list without destroying the dialog element or its Alpine state.
    -->
    <div id="item-list">
      <div class="item-row" data-item-id="1">
        <span class="item-name">Project Alpha</span>
        <button class="btn btn-destructive btn-sm"
                onclick="openConfirm('1', 'Project Alpha')">Delete</button>
      </div>
      <div class="item-row" data-item-id="2">
        <span class="item-name">Database Backup</span>
        <button class="btn btn-destructive btn-sm"
                onclick="openConfirm('2', 'Database Backup')">Delete</button>
      </div>
      <div class="item-row" data-item-id="3">
        <span class="item-name">API Keys Rotation</span>
        <button class="btn btn-destructive btn-sm"
                onclick="openConfirm('3', 'API Keys Rotation')">Delete</button>
      </div>
    </div>
  </div>

  <!--
    ─── Confirmation dialog — outside #item-list, never replaced ───────────
    Pattern P18: the dialog has no htmz wiring. openConfirm() dispatches
    a window event; Alpine's @open-confirm.window sets state and calls
    showModal(). Confirm removes the item from the DOM directly.
    ────────────────────────────────────────────────────────────────────────
  -->
  <dialog id="confirm-dialog"
          x-data="{
            itemName: '',
            itemId:   null,
            confirm() {
              console.log('[AJAX] Deleting item ' + this.itemId + ' (' + this.itemName + ')...');
              const dialog = document.getElementById('confirm-dialog');
              console.log('[AJAX] Dialog element:', dialog);
              
              fetch('https://jsonplaceholder.typicode.com/posts/' + this.itemId, {
                method: 'DELETE'
              })
              .then(response => {
                console.log('[AJAX] Status: ' + response.status + ' ' + response.statusText);
                return response.json();
              })
              .then(data => {
                console.log('[AJAX] Deletion success. Payload:', data);
                
                // DOM update
                const row = document.querySelector('[data-item-id=\'' + this.itemId + '\']');
                if (row) row.remove();
                
                const list = document.getElementById('item-list');
                if (list && !list.querySelector('[data-item-id]')) {
                  list.innerHTML = '<div class=\'empty-msg\'>No items remaining.</div>';
                }
              })
              .catch(err => {
                console.error('[AJAX] Request failed:', err);
              })
              .finally(() => {
                dialog.close();
              });
            }
          }"
          @open-confirm.window="
            itemName = $event.detail.name;
            itemId   = $event.detail.id;
            $el.showModal()
          ">

    <div class="dialog-header">
      <p class="dialog-title">Delete item?</p>
      <p class="dialog-subtitle">This action cannot be undone.</p>
    </div>
    <div class="dialog-body">
      You are about to permanently delete
      "<strong x-text="itemName"></strong>".
    </div>
    <div class="dialog-footer">
      <button class="btn btn-outline btn-sm"
              @click="$el.closest('dialog').close()">Cancel</button>
      <button class="btn btn-destructive btn-sm"
              @click="confirm()">Delete</button>
    </div>

  </dialog>

  <!-- htmz (166 bytes) — idle in this static demo; shows architectural placement -->
  <iframe hidden name="htmz"
    onload="setTimeout(()=>{
      const h = contentWindow.location.hash;
      if (!h) return;
      document.querySelector(h)?.replaceWith(...contentWindow.document.body.childNodes);
      if (window.basecoat) window.basecoat.initAll();
    },0)">
  </iframe>

  <script>
    /*
      Global bridge — called by Delete buttons inside #item-list.
      Dispatches a window event so Alpine can set dialog state and call
      showModal() declaratively. Fragment buttons can't reach Alpine
      component internals directly; the window event is the clean decoupling.
    */
    function openConfirm(id, name) {
      window.dispatchEvent(new CustomEvent('open-confirm', { detail: { id, name } }));
    }
  </script>

</body>
</html>
