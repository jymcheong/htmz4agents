<div id="email-capture" class="flex flex-col gap-6">
  <div class="text-center md:text-left">
    <h2 class="text-2xl font-bold font-title text-white tracking-tight">Unlock Elite Access</h2>
    <p class="text-slate-300 text-sm mt-2 leading-relaxed">
      Provide your email below to start receiving our highly specialized, token-efficient engineering reports.
    </p>
  </div>

  <form onsubmit="event.preventDefault(); animateSwap('success.html', 'form-area');" class="flex flex-col gap-4 mt-2">
    <div>
      <label for="user-name" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">First Name</label>
      <input type="text" id="user-name" required placeholder="Julian" 
             class="form-input w-full px-4 py-3 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none">
    </div>
    <div>
      <label for="user-email" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Email Address</label>
      <input type="email" id="user-email" required placeholder="julian@animejs.com" 
             class="form-input w-full px-4 py-3 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none">
    </div>
    
    <div class="mt-2 flex flex-col gap-3">
      <button type="submit"
         class="glow-effect block w-full py-3.5 px-6 bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-500 hover:to-indigo-600 text-white font-semibold text-center rounded-xl shadow-lg shadow-indigo-600/20 cursor-pointer transition-all duration-300 transform active:scale-[0.98]">
        Subscribe Now
      </button>
      
      <button type="button" onclick="animateSwap('newsletter-promo.html', 'form-area')" 
              class="text-xs text-slate-500 hover:text-slate-300 transition-colors text-center py-1 mt-1 block">
        ← Back to newsletter overview
      </button>
    </div>
  </form>
</div>
