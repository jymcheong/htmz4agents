<!DOCTYPE html>
<html>
<body id="toast-area">
  <!--
    htmz reads body.id ("toast-area") → finds #toast-area in main page → replaces outerHTML with this body.innerHTML.
    id="toast-area" on the div persists the mount point so subsequent button clicks can re-swap.
    Alpine is already loaded in main page — MutationObserver fires on insert → x-data inits automatically.
  -->
  <div id="toast-area"
       x-data="{ show: true }"
       x-show="show"
       x-init="setTimeout(() => show = false, 3000)"
       x-transition:enter="transition ease-out duration-300"
       x-transition:enter-start="opacity-0 translate-y-2"
       x-transition:enter-end="opacity-100 translate-y-0"
       x-transition:leave="transition ease-in duration-200"
       x-transition:leave-start="opacity-100 translate-y-0"
       x-transition:leave-end="opacity-0 translate-y-2"
       class="fixed bottom-6 right-6 z-50 bg-gray-900 text-white text-sm rounded-lg shadow-lg px-4 py-3 flex items-center gap-3 min-w-48">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-green-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
    </svg>
    <span>Action completed!</span>
  </div>
</body>
</html>
