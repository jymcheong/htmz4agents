<!DOCTYPE html>
<html>
<body id="card-area">
  <!--
    Swapped in by htmz. id="card-area" persists the mount point for further swaps.
    x-data initialised by Alpine MutationObserver — no manual initTree() call.
    x-on:click on the counter button proves Alpine bound events on swapped content.
  -->
  <div id="card-area"
       x-data="{ count: 0 }"
       class="bg-white rounded-lg border border-indigo-300 shadow-sm w-80">
    <div class="p-6 border-b border-indigo-100">
      <h3 class="text-lg font-semibold text-indigo-900">Swapped Card</h3>
      <p class="text-sm text-indigo-400 mt-1">Alpine re-inited on this new content</p>
    </div>
    <div class="p-6">
      <p class="text-sm text-gray-700">
        Clicked
        <span x-text="count" class="font-bold text-indigo-600">0</span>
        times — event bound by Alpine after htmz swap.
      </p>
    </div>
    <div class="p-6 pt-0 flex flex-col gap-2">
      <button
        x-on:click="count++"
        class="block w-full text-center bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-4 py-2 rounded-md cursor-pointer transition-colors">
        Click Me
      </button>
      <a href="toast.html#toast-area"
         target="htmz"
         class="block w-full text-center bg-gray-900 hover:bg-gray-700 text-white text-sm font-medium px-4 py-2 rounded-md cursor-pointer transition-colors">
        Do Action
      </a>
    </div>
  </div>
</body>
</html>
